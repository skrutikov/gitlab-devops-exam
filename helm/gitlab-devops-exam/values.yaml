images:
  gateway:
    repository: baranbartu/k-api-gateway
    tag: latest  # Default only; GitLab CI overrides this with CI_COMMIT_SHORT_SHA.
    pullPolicy: IfNotPresent  # Safe in CI because each commit uses a unique image tag.
  users:
    repository: baranbartu/k-users
    tag: latest  # Default only; GitLab CI overrides this with CI_COMMIT_SHORT_SHA.
    pullPolicy: IfNotPresent  # Safe in CI because each commit uses a unique image tag.
  orders:
    repository: baranbartu/k-orders
    tag: latest  # Default only; GitLab CI overrides this with CI_COMMIT_SHORT_SHA.
    pullPolicy: IfNotPresent  # Safe in CI because each commit uses a unique image tag.

gateway:
  replicaCount: 1
  service:
    type: NodePort
    port: 8000
    nodePort: 30000

internalServices:
  users:
    replicaCount: 1
    image:
      repository: baranbartu/k-users
      tag: latest
      pullPolicy: IfNotPresent
    service:
      port: 8000

  orders:
    replicaCount: 1
    image:
      repository: baranbartu/k-orders
      tag: latest
      pullPolicy: IfNotPresent
    service:
      port: 8000
